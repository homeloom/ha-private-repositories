name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Please write in English and remove personal data (names, addresses,
        IP addresses, tokens) from logs and screenshots. To report a security
        problem, use the Security tab instead of an issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Version of this project.
    validations:
      required: true
  - type: input
    id: homeassistant
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with personal data removed.
      render: text
