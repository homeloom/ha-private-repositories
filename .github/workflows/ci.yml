name: CI

# CI of a Home Assistant integration, built from the shared workflows of
# homeloom/ci. Branch protection requires the Report job.
#
# Draft pull requests run no job at all, which saves runner minutes while the
# work is in progress. Marking the pull request ready for review runs CI once.
# Editing the title or body runs it again, because the title becomes the
# commit message and both are checked for personal data.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  # A run started by hand checks the whole history as new.
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request, where a new push cancels the previous run, and
# one per commit on main, where every commit must be checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/hygiene.yml@dfb62a948d30fee08785389f5b85e75738784724 # v0.2.2
    permissions:
      contents: read
      # The hygiene job reads the current pull request title and body.
      pull-requests: read
    with:
      # Session links and noreply commit addresses of AI coding assistants.
      # Keep only the domains of the assistants that contribute.
      allowed-domains: anthropic.com claude.ai claude.com
    # Passes every secret: the denylist is the sum of the secrets whose names
    # start with PRIVACY_DENYLIST, and only the checks' own code reads them.
    secrets: inherit

  lint:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/python-lint.yml@dfb62a948d30fee08785389f5b85e75738784724 # v0.2.2

  tests:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/ha-tests.yml@dfb62a948d30fee08785389f5b85e75738784724 # v0.2.2

  validate:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/ha-integration.yml@dfb62a948d30fee08785389f5b85e75738784724 # v0.2.2

  report:
    name: Report
    # Runs after failed or cancelled jobs too, so that it fails with them
    # rather than being skipped, which branch protection counts as passed.
    # Skipped on drafts like every job: GitHub never merges a draft, and
    # marking it ready for review starts a full run.
    if: ${{ always() && github.event.pull_request.draft != true }}
    needs: [hygiene, lint, tests, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
